services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: modellens
      POSTGRES_PASSWORD: modellens
      POSTGRES_DB: modellens
    ports:
      # Host 5433 -> container 5432 (avoids clashing with a local Postgres).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modellens -d modellens"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://modellens:modellens@postgres:5432/modellens
      LLM_PROVIDER: fake
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
